services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env}
    volumes: [ postgres-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, pg_isready -U marketplace ]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [ redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru ]
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 5s
      timeout: 2s
      retries: 10
  app:
    build: .
    ports: [ '127.0.0.1:8097:8080' ]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/marketplace
      DB_PASSWORD: ${DB_PASSWORD:?required}
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:?required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?required}
      REDIS_HOST: redis
      CACHE_ENABLED: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 40s
    mem_limit: 768m
    cpus: 2
volumes:
  postgres-data:
